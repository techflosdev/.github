# Path-based PR labels for this hub repository.
# Product repos: copy and adjust paths/labels to match your layout.

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**.md"
          - "docs/**"
          - "profile/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/package-lock.json"
          - "**/pnpm-lock.yaml"
          - "**/yarn.lock"
          - "**/requirements*.txt"
          - "**/pyproject.toml"
          - "**/Cargo.lock"
          - "**/go.sum"

security:
  - changed-files:
      - any-glob-to-any-file:
          - "**/SECURITY.md"
          - ".github/workflows/*security*"
          - "**/*secret*"